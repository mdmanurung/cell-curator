[build-system]
requires = ["setuptools>=77", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "cell-curator"
version = "0.3.0"
description = "Independent evidence-driven multimodal cell-type annotation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Mikhael D. Manurung", email = "mikhael.manurung@gmail.com" }]
keywords = ["single-cell", "scRNA-seq", "cell-type annotation", "Cell Ontology", "anndata"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "anndata>=0.10",
  "mudata>=0.3",
  "networkx>=3.2",
  "numpy>=1.26",
  "pandas>=2.0",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "scipy>=1.11",
]

[project.urls]
Homepage = "https://github.com/mdmanurung/cell-curator"
Documentation = "https://mdmanurung.github.io/cell-curator/"
Source = "https://github.com/mdmanurung/cell-curator"
Issues = "https://github.com/mdmanurung/cell-curator/issues"
Changelog = "https://github.com/mdmanurung/cell-curator/blob/main/CHANGELOG.md"

[project.optional-dependencies]
celltypist = ["celltypist>=1.6"]
reference-models = ["scvi-tools>=1.2"]
census = ["cellxgene-census>=1.16"]
scimilarity = ["scimilarity>=0.4"]
gpu = ["rapids-singlecell>=0.12"]
workflow = [
  "snakemake>=8",
  "snakemake-executor-plugin-slurm>=2.7.1",
]
docs = [
  "furo>=2024.8",
  "myst-parser>=4.0",
  "sphinx>=8.1",
  "sphinx-copybutton>=0.5",
  "sphinx-design>=0.6",
]
dev = [
  "build>=1.2",
  "ipykernel>=6.29",
  "mypy>=1.10",
  "nbclient>=0.10",
  "nbformat>=5.10",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "setuptools>=77",
  "snakemake>=8",
  "snakemake-executor-plugin-slurm>=2.7.1",
  "wheel>=0.45",
]

[project.scripts]
cell-curator = "cell_curator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cell_curator = ["py.typed"]

[tool.setuptools.data-files]
"share/cell-curator" = ["skills/cell-curator/SKILL.md"]
"share/cell-curator/agents" = ["skills/cell-curator/agents/openai.yaml"]
"share/cell-curator/assets" = [
  "skills/cell-curator/assets/*.yaml",
  "skills/cell-curator/assets/*.md",
  "skills/cell-curator/assets/*.tsv",
]
"share/cell-curator/assets/markers" = ["skills/cell-curator/assets/markers/*.json"]
"share/cell-curator/references" = ["skills/cell-curator/references/*.md"]
"share/cell-curator/workflow" = ["workflow/Snakefile"]
"share/cell-curator/workflow/config" = ["workflow/config/*.yaml"]
"share/cell-curator/workflow/profiles/slurm" = ["workflow/profiles/slurm/config.yaml"]
"share/cell-curator/workflow/scripts" = ["workflow/scripts/*.py"]
"share/cell-curator/benchmarks" = ["benchmarks/*.json", "benchmarks/*.md"]
"share/cell-curator/benchmarks/manifests" = ["benchmarks/manifests/*.json"]
"share/cell-curator/benchmarks/fixtures" = ["benchmarks/fixtures/*.tsv"]
"share/cell-curator/benchmarks/results" = ["benchmarks/results/*.json"]
"share/cell-curator/schemas" = ["schemas/*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "gpu: requires a real contract-satisfying NVIDIA GPU with the RAPIDS stack installed",
]

# Coverage is measured in CI rather than through addopts so a local `pytest` run
# stays fast; `uv run pytest --cov` produces the same numbers. `fail_under` is the
# measured value, not a target: it is a floor that can only rise, so a change
# that adds untested code fails and a change that adds tests does not have to
# move it first. Branch coverage is on because this package expresses most of its
# contracts as `raise ContractError`, and statement coverage alone reports a
# gate as covered when only the passing side of it was ever taken.
[tool.coverage.run]
source = ["cell_curator"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
fail_under = 76
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.",
]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# One-off Census acquisition scripts kept beside the data they produced.
"benchmarks/data/**/*.py" = ["E702", "B905", "F841"]

[tool.mypy]
python_version = "3.11"
packages = ["cell_curator"]
ignore_missing_imports = true
warn_unused_ignores = true
