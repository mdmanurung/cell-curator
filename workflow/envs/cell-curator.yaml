# uv.lock is the authoritative complete lock. This pinned environment lets
# Snakemake --use-conda materialize the same core runtime from a source checkout.
name: cell-curator
channels:
  - conda-forge
dependencies:
  - python=3.11.12
  - pip=25.1.1
  - pip:
      - anndata==0.12.19
      - mudata==0.3.10
      - networkx==3.6.1
      - numpy==2.4.6
      - pandas==2.3.3
      - pydantic==2.13.4
      - PyYAML==6.0.3
      - scipy==1.17.1
      - -e .
