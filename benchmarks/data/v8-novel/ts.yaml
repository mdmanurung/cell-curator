# Package run configuration for the protocol v8 novel set: ts. One-shot final run.
#
# Copied from benchmarks/data/v8-dev/aida_split_a.yaml. Changed: run_id, annotation.study_id,
# input path, gene_mapping_path, expected_parent_count, context (tissue, experimental_context),
# writeback_prefix. Isolation is the AIFI dev split, as in aifi_dev.yaml.
# TISSUE: the corpus is scoped to blood and the package reads one tissue per run (guidance.context.tissue), so this pooled run gives blood records to every cell. See the hand-off.
# Gate A (assumptions) is the user's. Do not run before the method lock.

schema_version: 3

run:
  run_id: v8-novel-ts-001
  output_root: /exports/para-lipg-hpc/mdmanurung/cc-v8-work/runs
  mode: annotation

knowledge:
  providers:
    - kind: corpus
      # reviewed by Mikhael Manurung 2026-11-09: 34 accepted, 4 disputed (gate 3)
      path: /exports/para-lipg-hpc/mdmanurung/cell-curator/benchmarks/data/v8-corpus/reviewed_v3.json
      version: v8-r3
      sha256: "fdb47c46c4dfdf38ef3e4e59030d4971647a30318a569e67ab6ff9b067f6cf6c"
    - kind: ontology
      path: /exports/para-lipg-hpc/mdmanurung/cell-curator/benchmarks/data/aida-phase1-v2-pbmc-hvg2000/cl.obo
      version: releases/2026-06-08
  network: offline

annotation:
  enabled: true
  assay: transcriptome
  representation: lognorm
  study_id: tabula-sapiens-immune
  seed: 0
  isolation:
    donor_split: /exports/para-lipg-hpc/mdmanurung/cell-curator/benchmarks/data/aifi-hiha-dev-split/donor_split.tsv
    test_split: dev
    dataset_id: e522d2cd-7927-4e59-a4ed-064009569279

input:
  kind: h5ad
  path: /exports/para-lipg-hpc/mdmanurung/cc-v8-work/prep-ts-2026-11-09/input.h5ad
  expected_sha256: ""  # fill after the final input is frozen
  assays:
    transcriptome:
      modality: root
      kind: rna
      feature_space: gene
      feature_id_column: ""  # var_names are the unique symbols
      gene_mapping_path: /exports/para-lipg-hpc/mdmanurung/cc-v8-work/prep-ts-2026-11-09/gene_map.tsv
      capabilities:
        - identity
        - subtype
        - ontology_markers
      graph_representations:
        - source: obsm
          key: X_pca
      representations:
        lognorm:
          source: X
          feature_space: gene
          ranking_backend: scipy_mannwhitney
          ontology_compatible: true
          detection:
            source: layer
            key: counts
            required: true
            semantics: counts > 0
  keys:
    canonical_parent: bench_cluster
    scope: annotation_scope
    stored_resolutions: []
    embedding: X_pca
    spatial: ""
    donor: donor_id
    capture: ""
    doublet_class: ""
    doublet_score: ""
    sex: sex
    batch: ""
  required_obs_keys: []
  guide_columns: []
  technical_metrics: {}

canonical_partitions:
  ROOT:
    parent_key: bench_cluster
    expected_parent_count: 35

adaptive:
  parent_local:
    enabled: false
  outcomes:
    - ACCEPT SPLIT
    - RETAIN PARENT
    - DOUBLET/MIXED
    - TECHNICAL/UNRESOLVED
  eligibility:
    min_cells: 50
    min_donors: null
    min_captures: null
    rare_exceptions_require_approval: true
  audit:
    guide_entropy_min: 0.6
    meaningful_minority_fraction: 0.1
    doublet_fraction_max: null
    donor_max_fraction: null
    capture_max_fraction: null
    technical_effect_size_max: 0.15
    technical_metric_robust_z_max: 3.0
    incompatible_program_fraction_min: 0.15
    incompatible_program_columns: []
  stored_candidates:
    min_parent_purity: 0.9
    min_parent_fraction: 0.03
    max_parent_fraction: 0.95
    adjacent_jaccard_min: 0.8
    min_adjacent_matches: 1

comparators:
  roles:
    - parent_remainder
    - closest_sibling
  closest_sibling_strategy: embedding_centroid

review:
  critic_passes:
    - biological_coherence
    - negative_markers_and_alternatives
    - doublet_and_mixed
    - technical_confounding
    - ontology_hierarchy
  require_reconciliation: true
  require_explicit_human_approval: true
  type_and_state_separate: true

markers:
  rapids_singlecell_version: "9.9.9"
  rapids_distribution: rapids-singlecell-cu99
  cuda_major: 99
  allowed_gpu_contracts: []

evidence:
  lanes:
    - assay: transcriptome
      representation: lognorm
      required_for_acceptance: true
  adjusted_pvalue_max: 0.05
  require_both_marker_methods: true
  require_both_comparators: true
  required_candidate_gates:
    - stability_pass
    - candidate_vs_parent_remainder_pass
    - candidate_vs_closest_sibling_pass
    - positive_program_pass
    - expected_negative_program_pass
    - cell_level_separation_pass
    - source_corroboration_pass
  min_positive_coverage: 0.5
  # Protocol v2. See benchmarks/README.md for the derivation: the violation is the
  # fraction of measured negative markers flagged, and a 0.636 clustering ceiling means
  # contamination alone flags one marker in three. With three markers per program, 0.5
  # separates one flag (contamination) from two (contradiction). v1 used 0.2.
  max_negative_violation: 0.5
  # Protocol v3: same numbers as v2, now in vote-share units. A call needs 60% of
  # the cluster's cells to vote for it and a 20-point lead over the runner-up.
  min_confidence: 0.6
  min_margin: 0.2
  max_normalized_entropy: 0.85

guidance:
  interactive: true
  preauthorized: false
  reviewer: ""
  pause_after_each_level: true
  assumptions: []  # Gate A: the user writes and approves these
  hierarchy_levels:
    - L1
  context:
    organism: human
    tissue: blood
    developmental_stage: adult
    condition: healthy
    technology: dissociated
    experimental_context: Tabula Sapiens Immune (CELLxGENE c5d88abe-f23a-45fa-a534-788985e93dad), blood, spleen and lymph node, 10x 3' v3 and 5' v2 mixed
    composition_covariates: []
    vocabulary_contract: AIFI Human Immune Health Atlas corpus, 38 Cell Ontology terms
    reference_contract: local_only
    visualization_key: X_pca
    writeback_prefix: ts_novel
