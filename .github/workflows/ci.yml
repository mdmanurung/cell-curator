name: ci

# The CPU suite only. The RAPIDS lane in tests/test_gpu_hardware_lane.py skips
# itself without a contract-satisfying NVIDIA device, so a green run here says
# nothing about the GPU path — that one is validated by hand on a RAPIDS node.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Pinned, not merely floor-checked. Left to pick a default, the runner built a
      # 3.12 environment while [tool.mypy] declares python_version 3.11, so mypy read
      # 3.12-built anndata under 3.11 syntax rules and died on PEP 695 generics in a
      # dependency. The interpreter has to be the one the config and lockfile assume.
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --frozen resolves nothing: the job runs the environment uv.lock pins, so a
      # dependency that drifts fails here as a lockfile change rather than silently
      # in someone's install.
      - name: Sync the locked environment
        run: uv sync --frozen --extra dev --extra workflow

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy

      # Coverage is measured here rather than through pytest addopts so a local
      # `uv run pytest -q` stays fast. fail_under in pyproject.toml is the
      # measured floor, so this step fails on a drop and passes on an
      # improvement; the report is published as an artifact because a number
      # nobody can look at does not get improved.
      - name: Test
        run: >-
          uv run pytest -q
          --cov=cell_curator
          --cov-report=term:skip-covered
          --cov-report=xml
          --cov-report=json

      - name: Publish the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            coverage.json
          if-no-files-found: ignore
          retention-days: 14
